<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Recruiter Account - BlindHire</title>
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="logo-badge">BH</div>
                <h1>Create Account</h1>
                <p>Register as a recruiter on BlindHire</p>
            </div>

            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="form-input" placeholder="e.g. Alex Morgan" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Work Email Address</label>
                    <input type="email" id="reg-email" class="form-input" placeholder="recruiter@company.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-input" placeholder="Min. 6 characters" minlength="6" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-confirm-password">Confirm Password</label>
                    <input type="password" id="reg-confirm-password" class="form-input" placeholder="Re-enter password" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                    Create Account
                </button>
            </form>

            <div class="auth-switch">
                Already registered? <a href="/login.html">Sign In here</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
